<style>
  :root{
    --bg:#FBFBFC;
    --surface:#F0F1F2;
    --surface-press:#E6E7E9;
    --surface-2:#DFE1E4;
    --surface-2-press:#D2D5D9;
    --ink:#121316;
    --muted:#8B8F95;
    --ink-inv:#FBFBFC;
    --hair:rgba(0,0,0,.07);
    --sheet:#F6F7F8;
    --scrim:rgba(18,19,22,.32);
    --r-key:26px;
    --gap:10px;
  }
  html[data-theme="dark"]{
    --bg:#0D0E10;
    --surface:#191B1E;
    --surface-press:#222529;
    --surface-2:#2A2E33;
    --surface-2-press:#343940;
    --ink:#F3F4F6;
    --muted:#82878E;
    --ink-inv:#0D0E10;
    --hair:rgba(255,255,255,.08);
    --sheet:#15171A;
    --scrim:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Samsung Sans","SamsungOne",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    transition:background-color .28s ease,color .28s ease;
  }
  #app{
    height:100dvh;height:100svh;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 10px);
    max-width:560px;margin:0 auto;
  }

  /* ---------- topplinje ---------- */
  header{display:flex;align-items:center;justify-content:space-between;height:44px;flex:0 0 auto}
  .icon-btn{
    width:42px;height:42px;display:grid;place-items:center;
    border:0;background:transparent;color:var(--muted);
    border-radius:14px;cursor:pointer;transition:color .18s ease,background-color .18s ease,transform .12s ease;
  }
  .icon-btn:active{transform:scale(.9);color:var(--ink)}
  .icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .angle-tag{
    font-size:12px;letter-spacing:.06em;color:var(--muted);
    opacity:0;transition:opacity .22s ease;pointer-events:none;
  }
  .angle-tag.show{opacity:1}

  /* ---------- display ---------- */
  #display{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;
    gap:6px;padding:0 6px 18px;
  }
  #expr{
    width:100%;text-align:right;color:var(--muted);
    font-size:21px;font-weight:400;letter-spacing:-.01em;line-height:1.3;
    white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    min-height:28px;
  }
  #expr::-webkit-scrollbar{display:none}
  #result{
    width:100%;text-align:right;
    font-size:60px;font-weight:300;letter-spacing:-.025em;line-height:1.1;
    white-space:nowrap;overflow:hidden;
    transition:color .2s ease;
  }
  #result.preview{color:var(--muted);font-weight:300}
  #result.error{font-size:20px;font-weight:400;color:var(--muted);letter-spacing:0}
  @media (prefers-reduced-motion:no-preference){
    #result.settled{animation:settle .32s cubic-bezier(.22,.9,.3,1)}
  }
  @keyframes settle{from{transform:translateY(7px);opacity:.35}to{transform:none;opacity:1}}

  /* ---------- håndtak ---------- */
  .handle{
    flex:0 0 auto;align-self:center;
    width:66px;height:26px;margin-bottom:6px;
    display:grid;place-items:center;
    border:0;background:transparent;color:var(--muted);border-radius:13px;cursor:pointer;
  }
  .handle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .handle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,.8,.3,1)}
  html[data-sci="1"] .handle svg{transform:rotate(180deg)}

  /* ---------- tastatur ---------- */
  #sci{
    flex:0 0 auto;
    display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);
    overflow:hidden;max-height:0;opacity:0;margin-bottom:0;
    transition:max-height .3s cubic-bezier(.3,.8,.3,1),opacity .22s ease,margin-bottom .3s ease;
  }
  html[data-sci="1"] #sci{max-height:180px;opacity:1;margin-bottom:var(--gap)}
  #pad{
    flex:0 0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);
    grid-auto-rows:minmax(0,1fr);gap:var(--gap);
    height:min(52svh,430px);
  }
  html[data-sci="1"] #pad{height:min(44svh,390px)}

  .key{
    border:0;border-radius:var(--r-key);
    background:var(--surface);color:var(--ink);
    font-family:inherit;font-size:27px;font-weight:400;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    display:grid;place-items:center;cursor:pointer;
    transition:background-color .16s ease,transform .09s ease,color .16s ease;
  }
  .key:active{background:var(--surface-press);transform:scale(.955)}
  .key:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .key.fn{background:var(--surface-2);font-size:24px}
  .key.fn:active{background:var(--surface-2-press)}
  .key.op{background:var(--surface-2);font-size:29px}
  .key.op:active{background:var(--surface-2-press)}
  .key.eq{background:var(--ink);color:var(--ink-inv)}
  .key.eq:active{background:var(--ink);opacity:.82;transform:scale(.955)}
  .key svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  #sci .key{
    border-radius:20px;background:transparent;color:var(--ink);
    font-size:17px;font-weight:400;height:44px;
  }
  #sci .key:active{background:var(--surface)}
  #sci .key.active{background:var(--surface-2);color:var(--ink)}
  /* blokk, ikke grid: ellers blir <sup> et eget grid-element og havner på egen linje */
  #sci .key{display:block;text-align:center;line-height:44px;white-space:nowrap;padding:0}
  #sci .key sup{font-size:.6em;vertical-align:super;line-height:0}

  /* ---------- historikk ---------- */
  #scrim{
    position:fixed;inset:0;background:var(--scrim);
    opacity:0;pointer-events:none;transition:opacity .26s ease;z-index:5;
  }
  #scrim.show{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    max-height:72dvh;display:flex;flex-direction:column;
    background:var(--sheet);color:var(--ink);
    border-radius:28px 28px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(101%);transition:transform .3s cubic-bezier(.3,.85,.3,1);
    max-width:560px;margin:0 auto;
  }
  #sheet.show{transform:none}
  .grip{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:2px auto 10px}
  .sheet-top{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
  .sheet-top h2{font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em}
  .text-btn{
    border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;
    padding:8px 6px;cursor:pointer;border-radius:10px;
  }
  .text-btn:active{color:var(--ink)}
  #histList{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .hist{
    width:100%;border:0;background:transparent;color:inherit;font-family:inherit;
    text-align:right;padding:12px 4px;cursor:pointer;
    border-bottom:1px solid var(--hair);display:block;
  }
  .hist:active{opacity:.55}
  .hist .h-expr{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .h-res{display:block;font-size:24px;font-weight:300;margin-top:3px;letter-spacing:-.02em}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:36px 0 40px;line-height:1.5}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 2px;font-size:14px}
  .switch{
    width:46px;height:28px;border-radius:14px;border:0;background:var(--surface-2);
    position:relative;cursor:pointer;transition:background-color .2s ease;flex:0 0 auto;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:var(--bg);transition:transform .2s cubic-bezier(.3,.8,.3,1);
  }
  .switch[aria-checked="true"]{background:var(--ink)}
  .switch[aria-checked="true"]::after{transform:translateX(18px)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-height:700px){
    #result{font-size:50px}
    #pad{height:min(50svh,380px)}
    .key{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="btnHist" aria-label="Vis historikk">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span class="angle-tag" id="angleTag">DEG</span>
    <button class="icon-btn" id="btnTheme" aria-label="Bytt tema">
      <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </button>

  <div id="display">
    <div id="expr" aria-hidden="true"></div>

    <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg>

  <div id="sci" aria-hidden="true"></div>

</div>

<div id="scrim"></div>

<script id="calc-core">
/* Regnekjerne — ingen DOM. Kan testes isolert. */
(function(root){
  "use strict";
  var NBSP = "\u00A0";
  var OPS = ["+","\u2212","\u00D7","\u00F7","^"];
  var FUNCS = ["sin","cos","tan","asin","acos","atan","ln","log","\u221A"];
  var SUP = {"0":"\u2070","1":"\u00B9","2":"\u00B2","3":"\u00B3","4":"\u2074","5":"\u2075","6":"\u2076","7":"\u2077","8":"\u2078","9":"\u2079","-":"\u207B"};

  function isOp(t){ return OPS.indexOf(t) > -1; }
  function isFunc(t){ return FUNCS.indexOf(t) > -1; }
  function isNum(t){ return typeof t === "string" && /^-?(\d+\.?\d*|\.\d+|\d+\.)$/.test(t); }

  function CalcError(code){ this.name = "CalcError"; this.code = code; }
  CalcError.prototype = Object.create(Error.prototype);

  var MESSAGES = {
    div0: "Kan ikke dele p\u00E5 null",
    domain: "Utenfor definisjonsomr\u00E5det",
    range: "Tallet er for stort",
    syntax: null
  };
  function messageFor(code){ return Object.prototype.hasOwnProperty.call(MESSAGES, code) ? MESSAGES[code] : null; }

  function factorial(n){
    if (n < 0 || Math.abs(n - Math.round(n)) > 1e-9) throw new CalcError("domain");
    n = Math.round(n);
    if (n > 170) throw new CalcError("range");
    var r = 1;
    for (var i = 2; i <= n; i++) r *= i;
    return r;
  }

  function applyFunc(name, v, deg){
    var x = v;
    if (name === "sin" || name === "cos" || name === "tan"){
      if (deg){
        var m = ((x % 360) + 360) % 360;
        if (name === "tan" && (m === 90 || m === 270)) throw new CalcError("domain");
        if (name === "sin" && (m === 0 || m === 180)) return 0;
        if (name === "cos" && (m === 90 || m === 270)) return 0;
        x = x * Math.PI / 180;
      }
      return Math[name](x);
    }
    if (name === "asin" || name === "acos"){
      if (x < -1 || x > 1) throw new CalcError("domain");
      var r = Math[name](x);
      return deg ? r * 180 / Math.PI : r;
    }
    if (name === "atan"){
      var a = Math.atan(x);
      return deg ? a * 180 / Math.PI : a;
    }
    if (name === "ln"){ if (x <= 0) throw new CalcError("domain"); return Math.log(x); }
    if (name === "log"){ if (x <= 0) throw new CalcError("domain"); return Math.log10(x); }
    if (name === "\u221A"){ if (x < 0) throw new CalcError("domain"); return Math.sqrt(x); }
    throw new CalcError("syntax");
  }

  /* Rekursiv nedstigning over tokenlista. Manglende sluttparenteser lukkes automatisk. */
  function evaluate(tokens, deg){
    var i = 0;
    function peek(){ return tokens[i]; }
    function eat(){ return tokens[i++]; }

    function primary(){
      var t = peek();
      if (t === undefined) throw new CalcError("syntax");
      if (t === "("){ eat(); var v = expression(); if (peek() === ")") eat(); return v; }
      if (isFunc(t)){
        eat();
        if (peek() === "(") eat();
        var inner = expression();
        if (peek() === ")") eat();
        return applyFunc(t, inner, deg);
      }
      if (t === "\u03C0"){ eat(); return Math.PI; }
      if (t === "e"){ eat(); return Math.E; }
      if (isNum(t)){
        eat();
        var n = parseFloat(t);
        if (!isFinite(n)) throw new CalcError("syntax");
        return n;
      }
      throw new CalcError("syntax");
    }
    function postfix(){
      var v = primary();
      while (peek() === "!" || peek() === "\u00B2"){
        var op = eat();
        v = op === "!" ? factorial(v) : v * v;
      }
      return v;
    }
    function power(){
      var base = postfix();
      if (peek() === "^"){
        eat();
        var exp = unary();
        var r = Math.pow(base, exp);
        if (isNaN(r)) throw new CalcError("domain");
        return r;
      }
      return base;
    }
    function unary(){
      if (peek() === "\u2212"){ eat(); return -unary(); }
      return power();
    }
    function term(){
      var v = unary();
      while (peek() === "\u00D7" || peek() === "\u00F7"){
        var op = eat();
        var r = unary();
        if (op === "\u00F7"){
          if (r === 0) throw new CalcError("div0");
          v = v / r;
        } else {
          v = v * r;
        }
      }
      return v;
    }
    function expression(){
      var v = term();
      while (peek() === "+" || peek() === "\u2212"){
        var op = eat();
        var r = term();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }

    var value = expression();
    if (i < tokens.length) throw new CalcError("syntax");
    if (!isFinite(value)) throw new CalcError("range");
    return round(value);
  }

  /* 12 signifikante siffer fjerner flyttallsstøy (0,1 + 0,2). */
  function round(v){
    if (v === 0) return 0;
    var r = parseFloat(v.toPrecision(12));
    return r === 0 ? 0 : r;
  }

  function groupInt(digits){
    var neg = digits.charAt(0) === "-";
    if (neg) digits = digits.slice(1);
    var out = "";
    for (var i = 0; i < digits.length; i++){
      var fromEnd = digits.length - i;
      out += digits.charAt(i);
      if (fromEnd > 1 && fromEnd % 3 === 1) out += NBSP;
    }
    return (neg ? "\u2212" : "") + out;
  }

  function superscript(s){
    var out = "";
    for (var i = 0; i < s.length; i++) out += SUP[s.charAt(i)] || s.charAt(i);
    return out;
  }

  /* Ferdig resultat: gruppering, komma, potensform for ekstremverdier. */
  function formatNumber(v){
    if (v === 0) return "0";
    var abs = Math.abs(v);
    if (abs >= 1e12 || abs < 1e-9){
      var parts = v.toExponential(6).split("e");
      var mant = parts[0].replace(/0+$/, "").replace(/\.$/, "").replace(".", ",").replace("-", "\u2212");
      var exp = parseInt(parts[1], 10);
      return mant + NBSP + "\u00D7" + NBSP + "10" + superscript(String(exp));
    }
    var fixed = String(round(v));
    if (fixed.indexOf("e") > -1) fixed = v.toFixed(10);
    var seg = fixed.split(".");
    var frac = seg[1] ? seg[1].replace(/0+$/, "") : "";
    return groupInt(seg[0]) + (frac ? "," + frac : "");
  }

  /* Tall under innskriving: behold etterfølgende komma og nuller slik brukeren skrev dem. */
  function formatInput(t){
    var neg = t.charAt(0) === "-";
    var body = neg ? t.slice(1) : t;
    var seg = body.split(".");
    var out = groupInt(seg[0] === "" ? "0" : seg[0]);
    if (seg.length > 1) out += "," + seg[1];
    return (neg ? "\u2212" : "") + out;
  }

  function formatTokens(tokens){
    var out = "";
    for (var i = 0; i < tokens.length; i++){
      var t = tokens[i];
      var prev = tokens[i - 1];
      if (isOp(t)) out += (t === "^" ? t : NBSP + t + NBSP);
      else if (isNum(t)) out += formatInput(t);
      else if (isFunc(t)) out += t + (t === "\u221A" ? "" : "");
      else if (t === "(" ) out += (isNum(prev) || prev === ")" ? NBSP : "") + t;
      else out += t;
    }
    return out;
  }

  /* Prosent: "a + b%" = a + a·b/100, ellers b/100. */
  function applyPercent(tokens){
    var out = tokens.slice();
    var last = out[out.length - 1];
    if (!isNum(last)) return out;
    var n = parseFloat(last);
    var op = out[out.length - 2];
    var value = n / 100;
    if (op === "+" || op === "\u2212"){
      try {
        var base = evaluate(out.slice(0, out.length - 2), true);
        value = base * n / 100;
      } catch (e){ /* uten gyldig venstreside: vanlig prosent */ }
    }
    out[out.length - 1] = String(round(value));
    return out;
  }

  root.CalcCore = {
    evaluate: evaluate,
    formatNumber: formatNumber,
    formatTokens: formatTokens,
    formatInput: formatInput,
    applyPercent: applyPercent,
    messageFor: messageFor,
    isNum: isNum,
    isOp: isOp,
    isFunc: isFunc,
    round: round,
    NBSP: NBSP
  };
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>

<script id="calc-ui">
(function(){
  "use strict";
  var C = window.CalcCore;
  var MINUS = "\u2212", TIMES = "\u00D7", DIV = "\u00F7", SQRT = "\u221A", PI = "\u03C0";

  var state = {
    tokens: [],
    result: null,
    settled: false,
    lastExpr: "",
    deg: true,
    inv: false,
    haptics: true,
    history: []
  };

  var el = {
    expr: document.getElementById("expr"),
    result: document.getElementById("result"),
    pad: document.getElementById("pad"),
    sci: document.getElementById("sci"),
    handle: document.getElementById("handle"),
    angle: document.getElementById("angleTag"),
    sheet: document.getElementById("sheet"),
    scrim: document.getElementById("scrim"),
    hist: document.getElementById("histList"),
    themeIcon: document.getElementById("themeIcon"),
    meta: document.getElementById("metaTheme")
  };

  /* ---------- lagring ---------- */
  function load(key, fallback){
    try {
      var raw = localStorage.getItem("kalk." + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e){ return fallback; }
  }
  function save(key, value){
    try { localStorage.setItem("kalk." + key, JSON.stringify(value)); } catch (e){}
  }

  /* ---------- tema ---------- */
  var THEMES = ["auto", "light", "dark"];
  var themeMode = load("theme", "auto");
  var mq = window.matchMedia
    ? window.matchMedia("(prefers-color-scheme: dark)")
    : { matches: false, addEventListener: function(){}, addListener: function(){} };

  var ICONS = {
    auto: '<circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4a8.2 8.2 0 000-16.4z" fill="currentColor" stroke="none"/>',
    light: '<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
    dark: '<path d="M20 14.2A8.2 8.2 0 019.8 4a8.4 8.4 0 1010.2 10.2z"/>'
  };
  var LABELS = { auto: "Tema: automatisk", light: "Tema: lyst", dark: "Tema: m\u00F8rkt" };

  function resolved(){ return themeMode === "auto" ? (mq.matches ? "dark" : "light") : themeMode; }
  function applyTheme(){
    var r = resolved();
    document.documentElement.setAttribute("data-theme", r);
    el.themeIcon.innerHTML = ICONS[themeMode];
    document.getElementById("btnTheme").setAttribute("aria-label", LABELS[themeMode]);
    el.meta.setAttribute("content", r === "dark" ? "#0D0E10" : "#FBFBFC");
  }
  mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme);

  /* ---------- tastatur ---------- */
  function svg(path){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>"; }

  var MAIN = [
    { label: "AC", cls: "fn", act: "clear", aria: "Nullstill" },
    { label: svg('<path d="M9 5h9a2 2 0 012 2v10a2 2 0 01-2 2H9L2.8 12z"/><path d="M13 10l4 4M17 10l-4 4"/>'), cls: "fn", act: "back", aria: "Slett siste" },
    { label: "%", cls: "fn", act: "percent", aria: "Prosent" },
    { label: DIV, cls: "op", act: "op", value: DIV, aria: "Del" },
    { label: "7", cls: "", act: "digit", value: "7" },
    { label: "8", cls: "", act: "digit", value: "8" },
    { label: "9", cls: "", act: "digit", value: "9" },
    { label: TIMES, cls: "op", act: "op", value: TIMES, aria: "Gange" },
    { label: "4", cls: "", act: "digit", value: "4" },
    { label: "5", cls: "", act: "digit", value: "5" },
    { label: "6", cls: "", act: "digit", value: "6" },
    { label: MINUS, cls: "op", act: "op", value: MINUS, aria: "Minus" },
    { label: "1", cls: "", act: "digit", value: "1" },
    { label: "2", cls: "", act: "digit", value: "2" },
    { label: "3", cls: "", act: "digit", value: "3" },
    { label: "+", cls: "op", act: "op", value: "+", aria: "Pluss" },
    { label: "\u00B1", cls: "", act: "negate", aria: "Bytt fortegn" },
    { label: "0", cls: "", act: "digit", value: "0" },
    { label: ",", cls: "", act: "decimal", aria: "Desimaltegn" },
    { label: "=", cls: "eq", act: "equals", aria: "Er lik" }
  ];

  var SCI = [
    { id: "inv", label: "INV", act: "inv", aria: "Inverse funksjoner" },
    { label: "(", act: "paren", value: "(", aria: "Venstreparentes" },
    { label: ")", act: "paren", value: ")", aria: "H\u00F8yreparentes" },
    { id: "sqrt", label: SQRT, act: "sqrt", aria: "Kvadratrot" },
    { label: "x<sup>y</sup>", act: "pow", aria: "Opph\u00F8yd i" },
    { id: "sin", label: "sin", act: "fn", value: "sin" },
    { id: "cos", label: "cos", act: "fn", value: "cos" },
    { id: "tan", label: "tan", act: "fn", value: "tan" },
    { id: "ln", label: "ln", act: "ln" },
    { id: "log", label: "log", act: "log" },
    { label: PI, act: "const", value: PI, aria: "Pi" },
    { label: "e", act: "const", value: "e", aria: "Eulers tall" },
    { label: "x<sup>2</sup>", act: "square", aria: "Kvadrat" },
    { label: "n!", act: "fact", aria: "Fakultet" },
    { id: "angle", label: "DEG", act: "angle", aria: "Bytt mellom grader og radianer" }
  ];

  function build(list, container, cls){
    container.innerHTML = "";
    list.forEach(function(k){
      var b = document.createElement("button");
      b.className = "key " + (k.cls || cls || "");
      b.innerHTML = k.label;
      b.setAttribute("aria-label", k.aria || b.textContent);
      if (k.id) b.dataset.id = k.id;
      b.addEventListener("click", function(){ press(k); });
      container.appendChild(b);
    });
  }

  /* ---------- inndata ---------- */
  function last(){ return state.tokens[state.tokens.length - 1]; }

  function startFresh(){
    if (state.settled){
      state.tokens = [];
      state.settled = false;
    }
  }

  function pushDigit(d){
    startFresh();
    var t = last();
    if (C.isNum(t)){
      if (t === "0") state.tokens[state.tokens.length - 1] = d;
      else if (t === "-0") state.tokens[state.tokens.length - 1] = "-" + d;
      else state.tokens[state.tokens.length - 1] = t + d;
    } else if (t === ")" || t === "!" || t === "\u00B2" || t === PI || t === "e"){
      state.tokens.push(TIMES, d);
    } else {
      state.tokens.push(d);
    }
  }

  function pushDecimal(){
    startFresh();
    var t = last();
    if (C.isNum(t)){
      if (t.indexOf(".") === -1) state.tokens[state.tokens.length - 1] = t + ".";
    } else {
      state.tokens.push("0.");
    }
  }

  function pushOp(op){
    if (state.settled && state.result !== null){
      state.tokens = [String(state.result)];
      state.settled = false;
    }
    var t = last();
    if (t === undefined){
      if (op === MINUS) state.tokens.push(MINUS);
      return;
    }
    if (C.isOp(t)){
      state.tokens[state.tokens.length - 1] = op;
      return;
    }
    if (t === "(" ){
      if (op === MINUS) state.tokens.push(MINUS);
      return;
    }
    if (C.isFunc(t)) return;
    if (C.isNum(t) && (t === "-" || t.slice(-1) === ".")){
      state.tokens[state.tokens.length - 1] = t.replace(/[-.]$/, "") || "0";
    }
    state.tokens.push(op);
  }

  function pushFunc(name){
    startFresh();
    var t = last();
    if (C.isNum(t) || t === ")" || t === PI || t === "e" || t === "!" || t === "\u00B2") state.tokens.push(TIMES);
    state.tokens.push(name, "(");
  }

  function pushConst(v){
    startFresh();
    var t = last();
    if (C.isNum(t) || t === ")" || t === PI || t === "e") state.tokens.push(TIMES);
    state.tokens.push(v);
  }

  function pushParen(p){
    startFresh();
    var t = last();
    if (p === "("){
      if (C.isNum(t) || t === ")" || t === PI || t === "e") state.tokens.push(TIMES);
      state.tokens.push("(");
    } else {
      var open = state.tokens.filter(function(x){ return x === "("; }).length;
      var close = state.tokens.filter(function(x){ return x === ")"; }).length;
      if (open > close && (C.isNum(t) || t === ")" || t === PI || t === "e" || t === "!" || t === "\u00B2")) state.tokens.push(")");
    }
  }

  function pushPostfix(sym){
    var t = last();
    if (state.settled && state.result !== null){
      state.tokens = [String(state.result)];
      state.settled = false;
      t = last();
    }
    if (C.isNum(t) || t === ")" || t === PI || t === "e" || t === "!" || t === "\u00B2") state.tokens.push(sym);
  }

  function backspace(){
    if (state.settled){ state.settled = false; }
    var t = last();
    if (t === undefined) return;
    if (C.isNum(t) && t.length > 1){
      var next = t.slice(0, -1);
      state.tokens[state.tokens.length - 1] = (next === "-") ? "0" : next;
      if (state.tokens[state.tokens.length - 1] === "0" && next === "-") state.tokens.pop();
      return;
    }
    state.tokens.pop();
    if (C.isFunc(state.tokens[state.tokens.length - 1])) state.tokens.pop();
  }

  function negate(){
    var t = last();
    if (state.settled && state.result !== null){
      state.tokens = [String(state.result)];
      state.settled = false;
      t = last();
    }
    if (C.isNum(t)){
      state.tokens[state.tokens.length - 1] = t.charAt(0) === "-" ? t.slice(1) : "-" + t;
    } else if (t === undefined || C.isOp(t) || t === "("){
      state.tokens.push("-0");
    }
  }

  function equals(){
    if (!state.tokens.length) return;
    var value;
    try {
      value = C.evaluate(state.tokens, state.deg);
    } catch (e){
      flashError(e.code);
      return;
    }
    state.lastExpr = C.formatTokens(state.tokens);
    state.history.unshift({ e: state.lastExpr, r: C.formatNumber(value) });
    state.history = state.history.slice(0, 40);
    save("history", state.history);
    renderHistory();
    state.result = value;
    state.tokens = [String(value)];
    state.settled = true;
    render(true);
  }

  function flashError(code){
    var msg = C.messageFor(code);
    if (!msg) return;
    el.result.className = "error";
    el.result.textContent = msg;
  }

  function press(k){
    if (state.haptics && navigator.vibrate) navigator.vibrate(8);
    switch (k.act){
      case "digit": pushDigit(k.value); break;
      case "decimal": pushDecimal(); break;
      case "op": pushOp(k.value); break;
      case "clear": state.tokens = []; state.result = null; state.settled = false; break;
      case "back": backspace(); break;
      case "negate": negate(); break;
      case "percent": state.tokens = C.applyPercent(state.tokens); break;
      case "equals": equals(); return;
      case "paren": pushParen(k.value); break;
      case "const": pushConst(k.value); break;
      case "pow": pushOp("^"); break;
      case "square": pushPostfix("\u00B2"); break;
      case "fact": pushPostfix("!"); break;
      case "sqrt": state.inv ? pushPostfix("\u00B2") : pushFunc(SQRT); setInv(false); break;
      case "fn": pushFunc(state.inv ? "a" + k.value : k.value); setInv(false); break;
      case "ln":
        if (state.inv){ pushConst("e"); pushOp("^"); } else pushFunc("ln");
        setInv(false); break;
      case "log":
        if (state.inv){ pushConst("10"); pushOp("^"); } else pushFunc("log");
        setInv(false); break;
      case "inv": setInv(!state.inv); break;
      case "angle": state.deg = !state.deg; save("deg", state.deg); renderAngle(); break;
    }
    render(false);
  }

  /* ---------- visning ---------- */
  function setInv(on){
    state.inv = on;
    var map = {
      sin: on ? "sin<sup>\u22121</sup>" : "sin",
      cos: on ? "cos<sup>\u22121</sup>" : "cos",
      tan: on ? "tan<sup>\u22121</sup>" : "tan",
      ln: on ? "e<sup>x</sup>" : "ln",
      log: on ? "10<sup>x</sup>" : "log",
      sqrt: on ? "x<sup>2</sup>" : SQRT
    };
    Object.keys(map).forEach(function(id){
      var b = el.sci.querySelector('[data-id="' + id + '"]');
      if (b) b.innerHTML = map[id];
    });
    var inv = el.sci.querySelector('[data-id="inv"]');
    if (inv) inv.classList.toggle("active", on);
  }

  function renderAngle(){
    var b = el.sci.querySelector('[data-id="angle"]');
    if (b) b.textContent = state.deg ? "DEG" : "RAD";
    el.angle.textContent = state.deg ? "DEG" : "RAD";
    el.angle.classList.toggle("show", document.documentElement.getAttribute("data-sci") === "1" && !state.deg);
  }

  function fit(){
    var base = Math.min(60, Math.round(window.innerWidth * 0.155));
    var size = base;
    el.result.style.fontSize = size + "px";
    var guard = 0;
    while (el.result.scrollWidth > el.result.clientWidth && size > 22 && guard < 40){
      size -= 2; guard++;
      el.result.style.fontSize = size + "px";
    }
  }

  function render(settledNow){
    el.expr.textContent = state.settled ? state.lastExpr : C.formatTokens(state.tokens);
    el.expr.scrollLeft = el.expr.scrollWidth;

    if (state.settled){
      el.result.className = "";
      el.result.textContent = C.formatNumber(state.result);
      el.result.style.fontSize = "";
      fit();
      if (settledNow){
        el.result.classList.remove("settled");
        void el.result.offsetWidth;
        el.result.classList.add("settled");
      }
      return;
    }

    var preview = "";
    if (state.tokens.length){
      try { preview = C.formatNumber(C.evaluate(state.tokens, state.deg)); }
      catch (e){ preview = ""; }
    }
    el.result.className = "preview";
    el.result.textContent = preview || (state.tokens.length ? "" : "0");
    el.result.style.fontSize = "";
    fit();
  }

  /* ---------- historikk ---------- */
  function renderHistory(){
    el.hist.innerHTML = "";
    if (!state.history.length){
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Regnestykkene dine dukker opp her.";
      el.hist.appendChild(p);
      return;
    }
    state.history.forEach(function(h){
      var b = document.createElement("button");
      b.className = "hist";
      b.innerHTML = '<span class="h-expr"></span><span class="h-res"></span>';
      b.querySelector(".h-expr").textContent = h.e;
      b.querySelector(".h-res").textContent = h.r;
      b.setAttribute("aria-label", "Bruk resultatet " + h.r);
      b.addEventListener("click", function(){
        var plain = h.r.replace(/\u00A0/g, "").replace(/\u2212/g, "-").replace(",", ".");
        if (/^-?\d+(\.\d+)?$/.test(plain)){
          state.settled = false;
          state.tokens = [plain];
          render(false);
          closeSheet();
        }
      });
      el.hist.appendChild(b);
    });
  }

  }

    if (ev.metaKey || ev.ctrlKey) return;
    var k = ev.key;
    if (/^\d$/.test(k)) { press({ act: "digit", value: k }); ev.preventDefault(); return; }
    if (k === "Enter" || k === "=") { press({ act: "equals" }); ev.preventDefault(); return; }
    if (k === "Backspace") { press({ act: "back" }); ev.preventDefault(); return; }
    if (k === "Escape") { press({ act: "clear" }); ev.preventDefault(); return; }

  });
